<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="stylesheet" href="index.css" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Big+Shoulders:opsz,wght@10..72,100..900&family=Poppins:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&display=swap"
      rel="stylesheet"
    />
    <title>PollyGlot</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  </head>
  <body>
    <header>
      <nav>
        <img
          alt="PollyGlot logo with a cartoony parrot"
          class="logo-img"
          src="/assets/parrot.png"
        />
        <div class="logo-title">
          <h1>PollyGlot</h1>
          <p>Perfect Translation Every Time</p>
        </div>
      </nav>
    </header>
    <main>
      <form id="translation-form" class="translation-form">
        <section class="translation-text-section">
          <h3 class="main-menu-headers">Text to translate 👇</h3>
          <textarea
            id="user-input"
            name="sourceText"
            class="text-field source-text"
          ></textarea>
        </section>

        <section
          class="translation-languages-section"
          id="translation-languages-section"
        >
          <h3 class="main-menu-headers">Select language 👇</h3>
          <div class="language-options">
            <label class="language-labels">
              <input type="radio" name="language" value="french" checked />
              <span>French</span><img alt="" src="/assets/fr-flag.png" />
            </label>
            <label class="language-labels">
              <input type="radio" name="language" value="spanish" />
              <span>Spanish</span><img alt="" src="/assets/sp-flag.png" />
            </label>
            <label class="language-labels">
              <input type="radio" name="language" value="japanese" />
              <span>Japanese</span><img alt="" src="/assets/jpn-flag.png" />
            </label>
          </div>
        </section>

        <section
          class="translation-results-section hidden"
          id="translation-results-section"
        >
          <h3 class="main-menu-headers">Your translation 👇</h3>
          <p class="text-field target-text" id="translation-paragraph"></p>
        </section>

        <button id="submitTextButton" type="submit" class="submit-text-btn">
          Translate
        </button>
      </form>
    </main>
    <script src="index.js" type="module"></script>
  </body>
</html>
